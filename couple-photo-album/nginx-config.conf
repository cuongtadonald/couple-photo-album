# Nginx configuration for Tình Yêu Của Chúng Ta
# Location: /etc/nginx/sites-available/tinhy-au

# Upstream definition (where Node.js app is running)
upstream tinhy_au_app {
  # If running multiple instances, add all
  server 127.0.0.1:3000;
  # server 127.0.0.1:3001;
  # server 127.0.0.1:3002;
  # server 127.0.0.1:3003;
  
  keepalive 64;
}

# HTTP server block - redirect to HTTPS (if using SSL)
server {
  listen 80;
  listen [::]:80;
  server_name your_domain.com www.your_domain.com;

  # Let's Encrypt validation
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all HTTP to HTTPS
  location / {
    return 301 https://$server_name$request_uri;
  }
}

# HTTPS server block (main configuration)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name your_domain.com www.your_domain.com;

  # SSL Certificate paths (generated by Let's Encrypt)
  ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;

  # SSL Security Settings
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Logging
  access_log /var/log/nginx/tinhy-au-access.log;
  error_log /var/log/nginx/tinhy-au-error.log;

  # Client upload size limit
  client_max_body_size 50M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript 
             application/x-javascript application/xml+rss 
             application/javascript application/json;
  gzip_min_length 1000;
  gzip_disable "msie6";

  # Root location - proxy to Node.js
  location / {
    proxy_pass http://tinhy_au_app;
    proxy_http_version 1.1;
    
    # Headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;
    
    # Cache bypass
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;
  }

  # Static files caching (Next.js public folder)
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
    proxy_pass http://tinhy_au_app;
    proxy_set_header Host $host;
    proxy_cache_valid 200 365d;
    expires 365d;
    add_header Cache-Control "public, immutable";
    add_header Pragma public;
    add_header ETag "\"$date_gmt\"";
  }

  # Next.js specific cache headers
  location ~* \.(json|xml)$ {
    proxy_pass http://tinhy_au_app;
    proxy_set_header Host $host;
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # Health check endpoint (optional)
  location /health {
    proxy_pass http://tinhy_au_app;
    access_log off;
  }
}

# Redirect www to non-www (optional)
# Uncomment if you want to force non-www
